services:
  db:
    image: postgres:17-alpine
    container_name: synchoo-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-synchoo}
      POSTGRES_USER: ${DB_USER:-synchoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-synchoo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - synchoo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-synchoo} -d ${DB_NAME:-synchoo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synchoo-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - synchoo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synchoo-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    networks:
      - synchoo-net

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synchoo-scheduler
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    command: python manage.py run_scheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - synchoo-net

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synchoo-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - media_data:/usr/share/nginx/media:ro
    depends_on:
      - backend
    networks:
      - synchoo-net

volumes:
  pgdata:
  redisdata:
  media_data:

networks:
  synchoo-net:
    driver: bridge